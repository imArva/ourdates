<html lang="en">
<head>

<body class="min-h-screen bg-bg font-sans text-slate-700">
  <main class="mx-auto max-w-md px-4 pt-6 pb-28">
    <h1 class="serif mt-10 text-3xl">Our Little Dates ♡</h1>
    <p class="mb-6 text-sm">A tiny place for all our little moments.</p>

    <form id="auth" class="card space-y-3">
      <label class="block">Email<input name="email" type="email" required class="inp"></label>
      <label class="block">Password<input name="password" type="password" minlength="6" required class="inp"></label>

      <span class="flex justify-center items-center text-center gap-2">Don't have an account? <button type="button" id="signup" class="bg-accent p-2 rounded-lg font-bold text-slate-800">Sign up</button></span>
    </form>
  </main>
